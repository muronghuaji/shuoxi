<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'"
    />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="说戏 —— 导演式 AI 小说写作。你只动嘴，AI 动笔。"
    />
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem('shuoxi.appearance.v1') || '{}')
        const mode = stored.mode === 'light' || stored.mode === 'dark' || stored.mode === 'system'
          ? stored.mode
          : 'dark'
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const effective = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode
        const builtinAccents = ['amber', 'sage', 'blue', 'rose', 'violet', 'teal', 'coral', 'slate']
        const customAccents = Array.isArray(stored.customAccents) ? stored.customAccents : []
        const custom = typeof stored.accent === 'string' && stored.accent.startsWith('custom:')
          ? customAccents.find((item) => `custom:${item.id}` === stored.accent)
          : null
        const accent = custom ? 'custom' : builtinAccents.includes(stored.accent) ? stored.accent : 'amber'
        const uiScale = [100, 110, 125, 150].includes(stored.uiScale) ? stored.uiScale : 100
        document.documentElement.dataset.theme = effective
        document.documentElement.dataset.accent = accent
        document.documentElement.style.colorScheme = effective
        document.documentElement.style.setProperty('--ui-scale', String(uiScale / 100))
        if (custom && /^#[0-9a-f]{6}$/i.test(custom.color)) {
          const hex = custom.color
          const r = parseInt(hex.slice(1, 3), 16)
          const g = parseInt(hex.slice(3, 5), 16)
          const b = parseInt(hex.slice(5, 7), 16)
          const lighten = (value) => Math.round(value + (255 - value) * 0.16).toString(16).padStart(2, '0')
          const bright = `#${lighten(r)}${lighten(g)}${lighten(b)}`
          const root = document.documentElement.style
          root.setProperty('--amber', hex.toLowerCase())
          root.setProperty('--amber-strong', bright)
          root.setProperty('--amber-dim', `rgba(${r}, ${g}, ${b}, 0.13)`)
          root.setProperty('--accent-rgb', `${r}, ${g}, ${b}`)
          root.setProperty('--accent-gradient', `linear-gradient(180deg, ${bright}, ${hex.toLowerCase()})`)
          root.setProperty('--accent-contrast', (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.48 ? '#17120b' : '#faf7ef')
        }
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', effective === 'dark' ? '#0a0a0c' : '#f4efe6')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>说戏 · 把想看的戏，说出来</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
